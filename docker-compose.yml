include:
  - path:
      - supabase/docker-compose.yml
      - supabase/docker-compose.logs.yml
    project_directory: supabase
    env_file: .env

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${USUARIO_BD_N8N}
      DB_POSTGRESDB_PASSWORD: ${CONTRASENA_BD_N8N}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Las ejecuciones "no guardadas" se marcan como borradas y su contenido (con contraseñas de la API
      # de autenticación) queda hasta el borrado definitivo: se reduce de 1 h a unos minutos.
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: "0"
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: "1"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ./n8n:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.19
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      # Buzón de pruebas: sin autenticación ni TLS; no envía nada a internet
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025"
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      ORIGEN_FRONT: ${ORIGEN_FRONT}
      SECRETO_PROXY: ${SECRETO_PROXY}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./auth/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./auth/plantillas:/plantillas:ro
    tmpfs:
      - /data
      - /config
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - n8n

volumes:
  pgadmin_data:
