include:
  - path:
      - supabase/docker-compose.yml
      - supabase/docker-compose.logs.yml
    project_directory: supabase
    env_file: .env

services:
  pgadmin:
    image: dpage/pgadmin4:9.19
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      # Buzón de pruebas: sin autenticación ni TLS; no envía nada a internet
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025"
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  transcodificador:
    # Convierte los videos de clase a HLS cifrado con ffmpeg (SPEC 08). Solo se alcanza por la red de Docker.
    build: ./transcodificador
    restart: unless-stopped
    environment:
      SECRETO_TRANSCODIFICADOR: ${SECRETO_TRANSCODIFICADOR}
      CLAVE_SERVICIO: ${SERVICE_ROLE_KEY}
      URL_STORAGE: http://storage:5000
      URL_CALLBACK: http://api:3000/api/v1/interno/video-procesado
    volumes:
      - transcodificador-trabajo:/trabajo
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    depends_on:
      - api

  api:
    # API NestJS (SPEC 09). Aplica las migraciones de la base plataforma antes de servir.
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUERTO: "3000"
      ORIGEN_FRONT: ${ORIGEN_FRONT}
      JWT_SECRET: ${JWT_SECRET}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      URL_SUPABASE_AUTH: http://auth:9999
      # API admin de Supabase Auth (buscar_usuario, asignar_rol, invitar_equipo) y Storage (portadas)
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      URL_STORAGE: http://storage:5000
      # Transcodificador de videos (red interna): la API le pide los trabajos y recibe su aviso con el mismo secreto
      URL_TRANSCODIFICADOR: http://transcodificador:8090
      SECRETO_TRANSCODIFICADOR: ${SECRETO_TRANSCODIFICADOR}
      # Correo de las invitaciones del equipo: Mailpit, sin TLS ni autenticación
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      BD_HOST: db
      BD_PUERTO: "5432"
      USUARIO_BD_PLATAFORMA: ${USUARIO_BD_PLATAFORMA}
      CONTRASENA_BD_PLATAFORMA: ${CONTRASENA_BD_PLATAFORMA}
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin_data:
  transcodificador-trabajo:
